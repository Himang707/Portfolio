<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-udayaan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d09" />
      <stop offset="50%" stop-color="#050805" />
      <stop offset="100%" stop-color="#020402" />
    </linearGradient>
    <linearGradient id="poly-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fa329" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#182a0e" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="spatial-sphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72b535" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3b691a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg-grad-udayaan)" />

  <!-- Grid perspective lines -->
  <g stroke="#477A1E" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="430" x2="800" y2="430" />
    <line x1="0" y1="455" x2="800" y2="455" />
    <line x1="0" y1="472" x2="800" y2="472" />
    <line x1="100" y1="480" x2="350" y2="380" />
    <line x1="250" y1="480" x2="380" y2="380" />
    <line x1="400" y1="480" x2="400" y2="380" />
    <line x1="550" y1="480" x2="420" y2="380" />
    <line x1="700" y1="480" x2="450" y2="380" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="220" r="240" fill="url(#spatial-sphere)" />

  <!-- Top Status bar -->
  <rect x="40" y="35" width="720" height="44" rx="8" fill="#0d140d" stroke="#477A1E" stroke-opacity="0.3" stroke-width="1.2"/>
  <circle cx="65" cy="57" r="5" fill="#477A1E" />
  <circle cx="82" cy="57" r="5" fill="#3b691a" />
  <circle cx="99" cy="57" r="5" fill="#243d10" />
  <text x="130" y="62" fill="#88a37b" font-family="monospace" font-size="12" letter-spacing="1">UDAYAAN // 3D_SPATIAL_ENGINE :: [WEBGL_SHADERS: GLSL_V3.0]</text>
  <text x="650" y="62" fill="#75bb36" font-family="monospace" font-size="11" font-weight="bold">60.0 FPS</text>

  <!-- 3D Polyhedron Wireframe Mesh -->
  <g transform="translate(400, 220)">
    <!-- Outer Orbit rings -->
    <ellipse cx="0" cy="0" rx="220" ry="85" fill="none" stroke="#477A1E" stroke-opacity="0.25" stroke-dasharray="6,6" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="200" ry="110" fill="none" stroke="#6ca33a" stroke-opacity="0.15" stroke-dasharray="3,8" transform="rotate(35)"/>

    <!-- Geometric Facets -->
    <polygon points="0,-130 95,-45 0,35 -95,-45" fill="url(#poly-glow)" stroke="#6fb332" stroke-width="1.8" stroke-opacity="0.8"/>
    <polygon points="0,35 95,-45 120,70 0,130" fill="url(#poly-glow)" stroke="#477A1E" stroke-width="1.6" stroke-opacity="0.7"/>
    <polygon points="0,35 -95,-45 -120,70 0,130" fill="url(#poly-glow)" stroke="#3f6d19" stroke-width="1.6" stroke-opacity="0.6"/>
    <polygon points="0,-130 0,35 0,130" stroke="#8cd14b" stroke-width="1.2" stroke-opacity="0.75" stroke-dasharray="4,2"/>
    <polygon points="-95,-45 95,-45" stroke="#8cd14b" stroke-width="1.2" stroke-opacity="0.75"/>
    <polygon points="-120,70 120,70" stroke="#8cd14b" stroke-width="1.2" stroke-opacity="0.75"/>

    <!-- Glowing Nodes on vertices -->
    <circle cx="0" cy="-130" r="5" fill="#f0fae8" stroke="#5da124" stroke-width="2"/>
    <circle cx="95" cy="-45" r="5" fill="#f0fae8" stroke="#5da124" stroke-width="2"/>
    <circle cx="-95" cy="-45" r="5" fill="#f0fae8" stroke="#5da124" stroke-width="2"/>
    <circle cx="0" cy="35" r="6" fill="#ffffff" stroke="#75bb36" stroke-width="2.5"/>
    <circle cx="120" cy="70" r="4.5" fill="#f0fae8" stroke="#5da124" stroke-width="2"/>
    <circle cx="-120" cy="70" r="4.5" fill="#f0fae8" stroke="#5da124" stroke-width="2"/>
    <circle cx="0" cy="130" r="5" fill="#f0fae8" stroke="#5da124" stroke-width="2"/>

    <!-- Particle sparkles -->
    <circle cx="-150" cy="-90" r="2" fill="#75bb36" fill-opacity="0.7"/>
    <circle cx="170" cy="-70" r="2.5" fill="#a4df65" fill-opacity="0.8"/>
    <circle cx="190" cy="40" r="2" fill="#75bb36" fill-opacity="0.7"/>
    <circle cx="-180" cy="80" r="3" fill="#a4df65" fill-opacity="0.8"/>
    <circle cx="-60" cy="-150" r="1.5" fill="#e7f5de" fill-opacity="0.9"/>
  </g>

  <!-- Left Technical HUD Bracket -->
  <g transform="translate(60, 130)">
    <path d="M 12 0 L 0 0 L 0 80 L 12 80" fill="none" stroke="#477A1E" stroke-width="1.5"/>
    <text x="20" y="22" fill="#6ba34a" font-family="monospace" font-size="10">RENDER_PIPELINE</text>
    <text x="20" y="38" fill="#d2e3cc" font-family="sans-serif" font-size="12" font-weight="bold">Three.js + GLSL</text>
    <text x="20" y="54" fill="#88a37b" font-family="monospace" font-size="9">VERTEX_COUNT: 12,400</text>
    <text x="20" y="68" fill="#88a37b" font-family="monospace" font-size="9">DRAW_CALLS: 4</text>
  </g>

  <!-- Right Technical HUD Bracket -->
  <g transform="translate(620, 130)">
    <path d="M 108 0 L 120 0 L 120 80 L 108 80" fill="none" stroke="#477A1E" stroke-width="1.5"/>
    <text x="10" y="22" fill="#6ba34a" font-family="monospace" font-size="10">KINETIC_PHYSICS</text>
    <text x="10" y="38" fill="#d2e3cc" font-family="sans-serif" font-size="12" font-weight="bold">Damped Springs</text>
    <text x="10" y="54" fill="#88a37b" font-family="monospace" font-size="9">SPRING_STIFF: 140</text>
    <text x="10" y="68" fill="#88a37b" font-family="monospace" font-size="9">DAMPING_RATIO: 0.82</text>
  </g>
</svg>
